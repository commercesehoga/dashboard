<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="thunderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F7FF"/><stop offset="100%" stop-color="#0047FF"/>
    </linearGradient>
    <linearGradient id="thunderCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#66B2FF"/>
    </linearGradient>
    <filter id="thunderGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00CFFF" flood-opacity="0.9"/>
    </filter>
    <filter id="pulse">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00E5FF" flood-opacity="1"/>
    </filter>
  </defs>
  <polygon points="100,15 165,60 140,170 60,170 35,60" fill="url(#thunderGrad)" filter="url(#thunderGlow)"/>
  <polygon points="100,40 140,70 125,150 75,150 60,70" fill="#ffffff" opacity="0.92"/>
  <polygon points="105,55 85,105 105,105 95,145 130,85 105,85" fill="url(#thunderCore)" filter="url(#pulse)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
  </polygon>
  <line x1="70" y1="80" x2="130" y2="80" stroke="#B3E5FC" stroke-width="2" opacity="0.6"/>
  <line x1="75" y1="120" x2="125" y2="120" stroke="#B3E5FC" stroke-width="2" opacity="0.6"/>
  <circle cx="65" cy="95" r="2" fill="#00E5FF"><animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="135" cy="110" r="2" fill="#00E5FF"><animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/></circle>
  <text x="100" y="195" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#002BFF" font-weight="bold">THUNDER</text>
</svg>
