  <rect x="65" y="75" width="70" height="60" rx="12" fill="url(#silverInner)"/>
  <polygon points="100,85 108,105 130,105 112,118 120,140 100,125 80,140 88,118 70,105 92,105" fill="#AEB6BF"/>
  <text x="100" y="185" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#2C3E50" font-weight="bold">SILVER</text>
</svg>
