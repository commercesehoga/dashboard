  </defs>
  <polygon points="70,20 130,20 115,60 85,60" fill="url(#silverGrad)"/>
  <polygon points="70,20 85,60 60,55" fill="#C0C6CF"/>
  <polygon points="130,20 115,60 140,55" fill="#C0C6CF"/>
