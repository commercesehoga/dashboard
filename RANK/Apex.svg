<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/><stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="apexCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="apexGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.8"/>
    </filter>
  </defs>
  <polygon points="100,20 165,60 165,140 100,180 35,140 35,60" fill="url(#apexGrad)" filter="url(#apexGlow)"/>
  <polygon points="100,45 145,70 145,130 100,155 55,130 55,70" fill="#ffffff" opacity="0.95"/>
  <polygon points="100,65 130,125 70,125" fill="url(#apexCore)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <line x1="100" y1="65" x2="100" y2="125" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="70" y1="125" x2="130" y2="125" stroke="#C4B5FD" stroke-width="2"/>
  <circle cx="100" cy="35" r="6" fill="#C4B5FD">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="195" text-anchor="middle" font-size="16" font-family="Arial,sans-serif" fill="#4C1D95" font-weight="bold">APEX</text>
</svg>
